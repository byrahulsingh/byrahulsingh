server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Behind a proxy the internal port must not leak into redirects.
	absolute_redirect off;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

	# Hashed build assets (CSS, JS, images, fonts) never change: cache for a year.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Pages: always revalidate so a deploy shows up immediately.
	# /me serves /me/index.html directly, without a trailing-slash redirect.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		try_files $uri $uri/index.html $uri.html =404;
	}
}
